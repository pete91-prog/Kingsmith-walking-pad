services:
  walkingpad:
    build: .
    container_name: walkingpad
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      WALKINGPAD_HOST: "0.0.0.0"
      WALKINGPAD_PORT: "8080"
    # Replace the command with a real MAC when the host has Bluetooth:
    # command: ["walkingpad", "serve", "--host", "0.0.0.0", "--port", "8080", "--address", "AA:BB:CC:DD:EE:FF"]
    command: ["walkingpad", "serve", "--host", "0.0.0.0", "--port", "8080", "--demo"]
    volumes:
      - /var/run/dbus:/var/run/dbus
